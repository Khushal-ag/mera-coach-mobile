name: Release

# Cut a release by tagging vX.Y.Z (package.json + app.json expo.version must match)
# or via workflow_dispatch with the same tag.
#
# Flow: validate → EAS Android APK → GitHub Release
# - Android: production-apk → APK attached to the release
# - iOS: not built here yet (no Apple Developer account); app still runs on simulator

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0). Required for manual runs.'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      app_version: ${{ steps.meta.outputs.app_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vX.Y.Z (got: $TAG)" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          APP_VERSION="$(node -p "require('./app.json').expo.version")"

          if [[ "$PKG_VERSION" != "$VERSION" || "$APP_VERSION" != "$VERSION" ]]; then
            echo "Version mismatch: tag=$VERSION package.json=$PKG_VERSION app.json=$APP_VERSION" >&2
            echo "Bump package.json and app.json expo.version before tagging." >&2
            exit 1
          fi

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "app_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  build-android:
    name: EAS Android APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      build_id: ${{ steps.eas.outputs.build_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production APK on EAS
        id: eas
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${EXPO_TOKEN:-}" ]]; then
            echo "EXPO_TOKEN secret is not set. Add it under GitHub → Settings → Secrets and variables → Actions." >&2
            exit 1
          fi

          BUILD_JSON="$(eas build --platform android --profile production-apk --non-interactive --wait --json)"
          printf '%s' "$BUILD_JSON" > "$RUNNER_TEMP/eas-android.json"

          BUILD_ID="$(node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/eas-android.json', 'utf8'));
            const b = Array.isArray(d) ? d[0] : d;
            if (!b?.id) process.exit(1);
            process.stdout.write(String(b.id));
          ")"
          BUILD_URL="$(node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/eas-android.json', 'utf8'));
            const b = Array.isArray(d) ? d[0] : d;
            process.stdout.write(b?.artifacts?.buildUrl || b?.artifacts?.applicationArchiveUrl || '');
          ")"

          if [[ -z "$BUILD_URL" ]]; then
            VIEW_JSON="$(eas build:view "$BUILD_ID" --json)"
            printf '%s' "$VIEW_JSON" > "$RUNNER_TEMP/eas-android-view.json"
            BUILD_URL="$(node -e "
              const fs = require('fs');
              const d = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/eas-android-view.json', 'utf8'));
              process.stdout.write(d?.artifacts?.buildUrl || d?.artifacts?.applicationArchiveUrl || '');
            ")"
          fi

          if [[ -z "$BUILD_URL" ]]; then
            echo "Could not resolve Android artifact URL for build $BUILD_ID." >&2
            exit 1
          fi

          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "build_url=$BUILD_URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        env:
          TAG: ${{ needs.validate.outputs.release_tag }}
          BUILD_URL: ${{ steps.eas.outputs.build_url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-assets"
          APK_PATH="$RUNNER_TEMP/release-assets/MeraCoach-${TAG}-android.apk"
          curl --fail --location --output "$APK_PATH" "$BUILD_URL"
          ls -lh "$APK_PATH"

      - name: Upload APK for release job
        uses: actions/upload-artifact@v4
        with:
          name: mera-coach-android-apk
          path: ${{ runner.temp }}/release-assets/MeraCoach-${{ needs.validate.outputs.release_tag }}-android.apk
          if-no-files-found: error
          retention-days: 5

  github-release:
    name: GitHub Release
    needs: [validate, build-android]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Need tags for commit-range notes and --verify-tag
          fetch-tags: true

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: mera-coach-android-apk
          path: release-assets

      - name: Compose release notes
        id: notes
        env:
          TAG: ${{ needs.validate.outputs.release_tag }}
          VERSION: ${{ needs.validate.outputs.app_version }}
          ANDROID_BUILD_ID: ${{ needs.build-android.outputs.build_id }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"

          {
            echo "## Mera Coach ${TAG}"
            echo ""
            echo "Coach mobile app for [mera-coach.com](https://mera-coach.com) — Expo / React Native."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Version** | \`${VERSION}\` |"
            echo "| **Android package** | \`com.henchsolutions.meracoach\` |"
            echo ""
            echo "### Downloads"
            echo ""
            echo "- **Android APK** — attached as \`MeraCoach-${TAG}-android.apk\` (EAS profile \`production-apk\`)."
            echo "- EAS build id: \`${ANDROID_BUILD_ID}\`"
            echo ""
            echo "- **iOS** — not distributed yet (Apple Developer account required). Simulator / Expo Go still work for development."
            echo ""
            echo "### Notes"
            echo ""
            echo "- API base URL and related \`EXPO_PUBLIC_*\` values are baked at EAS build time."
            echo "- See the Releasing section of \`README.md\` in the repository for versioning and secrets."
            echo ""
            if git describe --tags --abbrev=0 "${TAG}^" >/dev/null 2>&1; then
              PREV="$(git describe --tags --abbrev=0 "${TAG}^")"
              echo "### Commits since ${PREV}"
              echo ""
              git log "${PREV}..${TAG}" --pretty=format:'- %s (%h)' --no-merges || true
              echo ""
            fi
          } > "$NOTES_FILE"

          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag exists
        env:
          TAG: ${{ needs.validate.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          # Tag push events already have the tag. Manual runs must use an existing tag
          # (do not push a new tag here — that would re-trigger this workflow).
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG does not exist locally after checkout." >&2
            echo "Create and push it first: git tag $TAG && git push origin $TAG" >&2
            echo "Or push the tag only and let the tag trigger run the release." >&2
            exit 1
          fi
          echo "Using existing tag $TAG → $(git rev-parse "$TAG")"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.release_tag }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find release-assets -name 'MeraCoach-*-android.apk' -type f | head -n 1)"
          if [[ -z "$APK" ]]; then
            echo "Expected APK under release-assets/ was missing." >&2
            exit 1
          fi

          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" --notes-file "$NOTES_FILE" --title "Mera Coach ${TAG}"
            gh release upload "$TAG" "$APK" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "$TAG" "$APK" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Mera Coach ${TAG}" \
              --notes-file "$NOTES_FILE" \
              --verify-tag
          fi
